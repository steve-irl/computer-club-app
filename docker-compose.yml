services:
  db:
    image: mariadb:10.3.32
    container_name: computer_club
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootclub
      MYSQL_DATABASE: computer_club
      MYSQL_USER: club_user
      MYSQL_PASSWORD: userclub
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: club_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mariadb_data:
